<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>iChess Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      background: #07090f;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #232c45;
    }
    .title {
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
    }
    .title span { color: #00adb5; }
    .badge {
      background: rgba(0, 173, 181, 0.2);
      border: 1px solid rgba(0, 173, 181, 0.4);
      color: #00adb5;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .action-buttons {
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-rescan {
      background: #131929;
      color: #00adb5;
      border: 1px solid rgba(0,173,181,0.4);
    }
    .btn-rescan:hover {
      background: rgba(0,173,181,0.12);
      color: #ffffff;
      border-color: #00adb5;
    }
    .section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #131929;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #232c45;
    }
    .row.highlight-brilliant {
      background: rgba(255, 75, 75, 0.1);
      border-color: rgba(255, 75, 75, 0.4);
    }
    .label {
      font-weight: 600;
      color: #94a3b8;
    }
    .label-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #00adb5;
      margin-top: 4px;
      margin-bottom: 2px;
    }
    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #232c45; transition: .2s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #00adb5; }
    input:checked + .slider:before { transform: translateX(16px); }

    input.brilliant-switch:checked + .slider { background-color: #ff4b4b; }

    select {
      width: 100%;
      background: #131929;
      border: 1px solid #232c45;
      color: #fff;
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
      outline: none;
    }
    select:focus { border-color: #00adb5; }
    .footer-note {
      font-size: 10px;
      color: #64748b;
      margin-top: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">i<span>Chess</span> Control</div>
    <div class="badge">ASSIST v4.2</div>
  </div>

  <!-- Action Button: Force Rescan -->
  <div class="action-buttons">
    <button id="btnForceRescan" class="btn btn-rescan">⚡ Force Rescan</button>
  </div>

  <div class="section">
    <!-- Toggle Best Move Overlay -->
    <div class="row">
      <span class="label">Show Best Move Overlay</span>
      <label class="switch">
        <input type="checkbox" id="toggleOverlay" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- 🔥 Brilliant Hunter Mode -->
    <div class="row highlight-brilliant">
      <div>
        <div style="font-weight: 800; color: #ff4b4b; font-size: 12px;">🔥 Brilliant Hunter</div>
        <div style="font-size: 10px; color: #94a3b8;">Hunts for piece sacrifices (!!)</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleBrilliant" class="brilliant-switch" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Stockfish Depth -->
    <div>
      <div class="label-title">Calculated Depth (Strength)</div>
      <select id="depthSelect">
        <option value="2">Depth 2  — Casual (~800 ELO)</option>
        <option value="4">Depth 4  — Beginner (~1000 ELO)</option>
        <option value="6" selected>Depth 6  — Club Player (~1350 ELO)</option>
        <option value="8">Depth 8  — Advanced Club (~1600 ELO)</option>
        <option value="10">Depth 10 — Expert (~1850 ELO)</option>
        <option value="12">Depth 12 — Candidate Master (~2100 ELO)</option>
        <option value="14">Depth 14 — FIDE Master (~2300 ELO)</option>
        <option value="16">Depth 16 — International Master (~2450 ELO)</option>
        <option value="18">Depth 18 — Grandmaster (~2600 ELO)</option>
        <option value="20">Depth 20 — Super GM (~2800 ELO)</option>
        <option value="22">Depth 22 — Engine Elite (~3000 ELO)</option>
        <option value="24">Depth 24 — Maximum Depth (~3500 ELO)</option>
      </select>
    </div>



  </div>

  <div class="footer-note">iChess Advanced Engine Assist</div>

  <script src="popup.js"></script>
</body>
</html>
